<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="converter-container">
    <h1>🌡️ Temperature Converter</h1>
    
    <input type="number" id="temperatureInput" placeholder="Enter temperature">

    <div class="unit-selection">
      <label><input type="radio" name="unit" value="C" checked> Celsius</label>
      <label><input type="radio" name="unit" value="F"> Fahrenheit</label>
      <label><input type="radio" name="unit" value="K"> Kelvin</label>
    </div>

    <button id="convertBtn">Convert</button>

    <div class="result">
      <h2 id="resultText">Converted temperature will appear here</h2>
    </div>
  </div>

  <script src="script.js"></script>
  
  <a href="https://get.fampay.in/BOYAM620G">link</a>
</body>
</html>
